<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПИПЛ · Вход для команды</title>
    <meta name="theme-color" content="#95B8D9">
    <style>
        @font-face {
            font-family: 'Onest';
            src: url('res/fonts/Onest.ttf') format('truetype');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }
        :root {
            --bg: #95B8D9; --bg-2: #A9C9E1; --bg-deep: #84ACCD;
            --ink: #243029;
            --keyword-white: #FFFFFF;
            --card: #FFFFFF; --card-2: #F5F9FC;
            --brand: #95B8D9; --brand-2: #C2D8EA; --brand-deep: #5E8FBD; --brand-ink: #3F6B99;
            --warm: #5E8FBD;
            --text: #243029;
            --contrast: #243029; --contrast-soft: rgba(36,48,41,0.68);
            --text-soft: rgba(36,48,41,0.66); --text-faint: rgba(36,48,41,0.42);
            --line: rgba(36,48,41,0.14); --error: #C46545; --error-bg: rgba(196,101,69,0.12);
            --radius: 26px; --radius-sm: 16px;
            --shadow: 0 30px 70px -28px rgba(31,58,84,0.35);
            --ease: cubic-bezier(0.22,1,0.36,1); --ease-spring: cubic-bezier(0.34,1.56,0.64,1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .beans-layer { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; opacity: 0.12; }
        .bean {
            position: absolute; display: block;
            background: #FFFFFF;
            border-radius: 58% 58% 58% 58% / 74% 74% 38% 38%;
            box-shadow: inset -4px -6px 10px rgba(36, 48, 41, 0.12);
            animation: beanBob var(--d, 14s) ease-in-out infinite;
            animation-delay: var(--dl, 0s);
        }
        .bean::after {
            content: ''; position: absolute; left: 50%; top: 12%; bottom: 12%;
            width: 16%; margin-left: -8%; transform: rotate(-16deg);
            background: rgba(36, 48, 41, 0.3); border-radius: 50%;
        }
        @keyframes beanBob {
            0%, 100% { transform: translateY(0) rotate(-8deg); }
            50% { transform: translateY(-22px) rotate(10deg); }
        }
        body {
            font-family: 'Onest', 'Inter', sans-serif; color: var(--keyword-white); min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            background:
                radial-gradient(900px 460px at 88% -10%, rgba(255, 255, 255, 0.28), transparent 62%),
                radial-gradient(760px 420px at -10% 32%, rgba(255, 255, 255, 0.16), transparent 60%),
                linear-gradient(180deg, #9DBFD8 0%, #95B8D9 55%, #8FB1D1 100%);
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
        }
        .header { width: 100%; max-width: 640px; padding: 1.5rem 1.2rem 0; position: relative; z-index: 3; }
        .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--keyword-white); text-decoration: none; font-weight: 800; font-size: 0.86rem; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.7; transition: opacity 0.3s; }
        .brand:hover { opacity: 1; }
        .card {
            width: min(440px, calc(100% - 2.4rem)); margin: clamp(1.4rem, 5vh, 4rem) auto 2rem;
            background: rgba(255,255,255,0.94); border: 1px solid rgba(255,255,255,0.5); border-radius: var(--radius);
            padding: 2.4rem 2rem; box-shadow: var(--shadow); backdrop-filter: blur(16px);
            animation: popIn 0.55s var(--ease-spring); position: relative; z-index: 3;
        }
        @keyframes popIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
        .card h1 { font-size: 1.7rem; font-weight: 900; letter-spacing: -0.03em; margin-bottom: 0.3rem; }
        .subtitle { color: var(--text-soft); font-size: 0.9rem; font-weight: 500; margin-bottom: 1.6rem; }
        .kicker { font-size: 0.62rem; font-weight: 800; letter-spacing: 0.24em; text-transform: uppercase; color: var(--warm); margin-bottom: 0.5rem; }
        .field { margin-bottom: 1.1rem; }
        .field label { display: block; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-soft); margin-bottom: 0.45rem; }
        .input { width: 100%; padding: 0.85rem 1.1rem; border-radius: 14px; font-size: 1rem; font-weight: 600; background: rgba(255,255,255,0.9); border: 1px solid var(--line); color: var(--text); transition: border-color 0.3s, box-shadow 0.3s; outline: none; font-family: inherit; }
        .input::placeholder { color: var(--text-faint); }
        .input:focus { border-color: var(--brand-deep); box-shadow: 0 0 0 3px rgba(149,184,217,0.28); }
        .btn { border: 1px solid var(--line); font-weight: 800; padding: 1rem 1.7rem; font-size: 0.76rem; letter-spacing: 0.08em; text-transform: uppercase; border-radius: 100px; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; width: 100%; transition: transform 0.35s var(--ease-spring), box-shadow 0.35s; -webkit-tap-highlight-color: transparent; }
        .btn-primary { background: linear-gradient(135deg, var(--brand), var(--brand-deep)); color: #FFFFFF; border-color: transparent; box-shadow: 0 14px 34px -14px rgba(36,48,41,0.35); transition: transform 0.35s var(--ease-spring), box-shadow 0.35s, background 0.3s, color 0.3s; }
        .btn-primary:hover { transform: translateY(-3px); background: var(--ink); color: #FFFFFF; box-shadow: 0 20px 50px -16px rgba(36,48,41,0.5); }
        .hidden { display: none !important; }
        a:focus-visible, button:focus-visible { outline: 3px solid rgba(149,184,217,0.6); outline-offset: 3px; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="beans-layer" id="beansLayer" aria-hidden="true"></div>

    <header class="header">
        <a class="brand" href="index.html"><i class="fas fa-arrow-left" style="opacity:0.8;"></i> На главную</a>
    </header>

    <main class="card">
        <div class="kicker">Вход для команды</div>
        <h1>Персонал и владелец</h1>
        <p class="subtitle">Войдите по почте и паролю</p>

        <div id="passwordForm" style="margin-top:0.4rem;">
                <div class="field"><label>Логин</label><input type="text" class="input" id="staffLogin" placeholder="admin" autocomplete="username"></div>
                <div class="field"><label>Пароль</label><input type="password" class="input" id="staffPassword" placeholder="••••••••" autocomplete="current-password"></div>
                <button type="button" class="btn btn-primary" onclick="loginStaff()"><i class="fas fa-sign-in-alt"></i> Войти</button>
            </div>
    </main>

    <div class="toast" id="toast" role="status" style="position:fixed; bottom:34px; left:50%; transform:translateX(-50%) translateY(140px); background:var(--card); color:var(--text); padding:15px 30px; border-radius:100px; font-size:0.92rem; font-weight:800; z-index:3000; opacity:0; transition:all 0.5s var(--ease-spring); max-width:min(90vw,560px); text-align:center; line-height:1.45; border:1px solid var(--line); box-shadow:var(--shadow);"></div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
        'use strict';

        const API = (window.location.protocol === 'file:' || ['localhost', '127.0.0.1'].includes(window.location.hostname))
            ? 'http://localhost:3000/api'
            : window.location.origin + '/api';

        function spawnBeans() {
            const layer = document.getElementById('beansLayer');
            if (!layer) return;
            const count = Math.min(18, Math.floor(window.innerWidth / 110));
            for (let i = 0; i < count; i++) {
                const b = document.createElement('span');
                b.className = 'bean';
                const s = 12 + Math.random() * 34;
                b.style.width = s + 'px';
                b.style.height = (s * 0.72) + 'px';
                b.style.left = (Math.random() * 100) + '%';
                b.style.top = (Math.random() * 100) + '%';
                b.style.setProperty('--d', (9 + Math.random() * 10).toFixed(1) + 's');
                b.style.setProperty('--dl', (Math.random() * 6).toFixed(1) + 's');
                layer.appendChild(b);
            }
            window.addEventListener('scroll', () => {
                layer.style.translate = '0 ' + (window.scrollY * 0.35) + 'px';
            }, { passive: true });
        }
        spawnBeans();

        function toast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.borderColor = type === 'error' ? 'rgba(196,101,69,0.4)' : 'rgba(78,138,95,0.4)';
            t.style.color = type === 'error' ? '#C46545' : '#4E8A5F';
            t.style.opacity = 1;
            t.style.transform = 'translateX(-50%) translateY(0)';
            clearTimeout(t._timer);
            t._timer = setTimeout(() => { t.style.opacity = 0; t.style.transform = 'translateX(-50%) translateY(140px)'; }, 3400);
        }

        async function api(path, opts = {}) {
            const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
            const res = await fetch(API + path, Object.assign({}, opts, { headers }));
            let data = null;
            try { data = await res.json(); } catch (e) { data = null; }
            return { ok: res.ok, status: res.status, data };
        }

        async function loginStaff() {
            const login = document.getElementById('staffLogin').value.trim();
            const pass = document.getElementById('staffPassword').value;
            if (!login || !pass) return toast('Заполните все поля', 'error');
            try {
                const { ok, data } = await api('/auth/login', { method: 'POST', body: JSON.stringify({ login, password: pass }) });
                if (!ok) return toast((data && data.error) || 'Ошибка входа', 'error');
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                toast('Успешно! Открываем личный кабинет…', 'success');
                setTimeout(() => { location.href = 'index.html'; }, 700);
            } catch (e) {
                toast('Ошибка соединения с сервером', 'error');
            }
        }

        document.getElementById('staffPassword').addEventListener('keydown', e => { if (e.key === 'Enter') loginStaff(); });
    </script>
</body>
</html>
