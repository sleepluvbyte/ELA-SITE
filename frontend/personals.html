<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПИПЛ · Вход для команды</title>
    <meta name="theme-color" content="#95B8D9">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23243029'/%3E%3Ctext x='50' y='72' font-size='62' text-anchor='middle' fill='%23F5F1EA' font-family='Arial Black'%3E%D0%9F%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/pipl.css">
</head>
<body>

<div class="auth-page">
    <div class="auth-top">
        <a class="back-link" href="/">← НА ГЛАВНУЮ</a>
        <span class="mono-label">PIPL. / STAFF</span>
    </div>

    <div class="auth-box">
        <div class="section-label">// ВХОД ДЛЯ КОМАНДЫ</div>
        <h1>ПЕРСОНАЛ И ВЛАДЕЛЕЦ</h1>
        <div class="auth-badge"><i class="fas fa-user-shield"></i> ADMIN · OWNER</div>

        <div class="field">
            <label for="staffLogin">ЛОГИН</label>
            <input type="text" class="input" id="staffLogin" placeholder="admin" autocomplete="username">
        </div>
        <div class="field">
            <label for="staffPassword">ПАРОЛЬ</label>
            <input type="password" class="input" id="staffPassword" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="button" class="btn btn-block" id="loginBtn" onclick="loginStaff()"><i class="fas fa-sign-in-alt"></i> ВОЙТИ</button>

        <p class="auth-note">
            Владелец — <a href="/owner">кабинет владельца</a><br>
            Клиенты — кнопка «Войти» на <a href="/">главной</a>
        </p>
    </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
    'use strict';

    const API = (window.location.protocol === 'file:' || ['localhost', '127.0.0.1'].includes(window.location.hostname))
        ? 'http://localhost:3000/api'
        : window.location.origin + '/api';

    function toast(msg, type = '') {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast ' + type + ' show';
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove('show'), 3400);
    }

    async function api(path, opts = {}) {
        const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
        const res = await fetch(API + path, Object.assign({}, opts, { headers }));
        let data = null;
        try { data = await res.json(); } catch (e) { data = null; }
        return { ok: res.ok, status: res.status, data };
    }

    async function loginStaff() {
        const btn = document.getElementById('loginBtn');
        const login = document.getElementById('staffLogin').value.trim();
        const pass = document.getElementById('staffPassword').value;
        if (!login || !pass) return toast('Заполните все поля', 'error');
        btn.disabled = true;
        try {
            const { ok, data } = await api('/auth/login', { method: 'POST', body: JSON.stringify({ login, password: pass }) });
            if (!ok) return toast((data && data.error) || 'Ошибка входа', 'error');
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            toast('Успешно! Открываем личный кабинет…', 'success');
            setTimeout(() => { location.href = '/'; }, 700);
        } catch (e) {
            toast('Ошибка соединения с сервером', 'error');
        } finally {
            btn.disabled = false;
        }
    }

    document.getElementById('staffPassword').addEventListener('keydown', e => { if (e.key === 'Enter') loginStaff(); });
    document.getElementById('staffLogin').addEventListener('keydown', e => { if (e.key === 'Enter') loginStaff(); });
</script>
</body>
</html>
